name: CN2 VPS Stock Monitor

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests beautifulsoup4 lxml

      - name: Run monitor
        run: python vps_monitor.py

      - name: Commit state
        if: always()
        run: |
          git config user.name "VPS Monitor Bot"
          git config user.email "bot@vps-monitor.local"
          if [ -f vps_monitor_state.json ]; then
            git add vps_monitor_state.json vps_monitor_result.txt
            git diff --cached --quiet || (git commit -m "Status update $(TZ=Asia/Shangh